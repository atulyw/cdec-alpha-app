# SonarCloud project configuration for auth-service (Maven).
# Placeholders below are overridden in CI via GitHub Secrets or locally via -D flags / env vars.
#
# Docs: https://docs.sonarsource.com/sonarcloud/advanced-setup/ci-based-analysis/sonarscanner-for-maven/

# SonarCloud organization key (Settings → Organization → Key)
sonar.organization=atulyw

# Unique project key (SonarCloud → Project → Project Information)
sonar.projectKey=atulyw_auth-service

# SonarCloud endpoint (do not change for cloud-hosted analysis)
sonar.host.url=https://sonarcloud.io

# Source and test roots (standard Maven layout)
sonar.sources=application/backend/auth-service/src/main/java
sonar.tests=application/backend/auth-service/src/test/java

# Compiled classes and test reports required for Java analysis
sonar.java.binaries=application/backend/auth-service/target/classes
sonar.java.test.binaries=application/backend/auth-service/target/test-classes
sonar.junit.reportPaths=application/backend/auth-service/target/surefire-reports

# JaCoCo XML report path — must match jacoco-maven-plugin output in pom.xml
sonar.coverage.jacoco.xmlReportPaths=application/backend/auth-service/target/site/jacoco/jacoco.xml

sonar.sourceEncoding=UTF-8
